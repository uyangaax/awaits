<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour — Pure Magic Awaits</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style type="text/tailwindcss"></style>
  </head>

  <body
    class="font-body bg-gradient-to-b from-[#dce7f0] via-[#d3e2ee] to-[#b9d2e6] text-slate-900"
  >
    <section
      class="relative flex min-h-screen w-full flex-col bg-cover bg-center bg-no-repeat text-white"
      style="background-image: url(&quot;./HeroImage.png&quot;)"
    >
      <div class="absolute inset-0 bg-black/20"></div>
      <div
        class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-b from-transparent to-[#dce7f0]"
      ></div>

      <header class="relative z-10 flex items-center justify-between px-8 py-6">
        <a href="#" class="flex items-center">
          <img src="logo 1.png" alt="Logo" class="h-20 w-20 object-contain" />
        </a>

        <nav class="flex items-center gap-8 text-sm font-medium">
          <a href="#" class="hover:opacity-80">Home</a>
          <a href="#" class="hover:opacity-80">About</a>
          <a href="#" class="hover:opacity-80">Contact</a>

          <a
            href="#"
            class="grid h-9 w-9 place-items-center rounded-full border border-white/70"
          >
            <img src="user.png" alt="User" class="h-5 w-5 object-contain" />
          </a>
        </nav>
      </header>

      <div
        class="relative z-10 flex flex-1 flex-col items-center justify-center px-4 pb-24 text-center"
      >
        <p
          class="font-display text-[clamp(1.6rem,3.6vw,3.25rem)] font-semibold uppercase tracking-[0.18em] text-white/85"
        >
          Pure Magic
        </p>
        <h1
          class="font-display -mt-1 text-[clamp(4rem,16.5vw,13rem)] font-bold uppercase leading-[0.8] tracking-[-0.02em] text-white drop-shadow-sm"
        >
          Awaits!
        </h1>
        <p
          class="font-display mt-6 text-[clamp(1.25rem,3.2vw,2.6rem)] font-semibold uppercase tracking-[0.08em] text-white"
        >
          2024
        </p>
      </div>
    </section>

    <section class="flex flex-wrap justify-center gap-5 px-6 pt-10">
      <div
        class="relative h-[370px] w-[252px] overflow-hidden rounded-2xl border-4 border-sky-200 shadow-md"
      >
        <img
          src="terkhiinTsagaan.png"
          alt="Terkhiin tsagaan lake"
          class="absolute inset-0 h-full w-full object-cover"
        />
        <div class="absolute inset-0 bg-black/25"></div>
        <h3
          class="relative z-10 flex h-full items-center justify-center px-4 text-center font-display text-2xl font-semibold uppercase text-white drop-shadow"
        >
          Terkhiin tsagaan lake
        </h3>
      </div>

      <div
        class="relative h-[370px] w-[252px] overflow-hidden rounded-2xl border-4 border-sky-200 shadow-md"
      >
        <img
          src="monestry.png"
          alt="Amarbayasgalant monastery"
          class="absolute inset-0 h-full w-full object-cover"
        />
        <div class="absolute inset-0 bg-black/25"></div>
        <h3
          class="relative z-10 flex h-full items-center justify-center px-4 text-center font-display text-2xl font-semibold uppercase text-white drop-shadow"
        >
          Amarbayasgalant monastery
        </h3>
      </div>

      <div
        class="relative h-[370px] w-[252px] overflow-hidden rounded-2xl border-4 border-sky-200 shadow-md"
      >
        <img
          src="huwsgul.png"
          alt="Khuvsgul lake"
          class="absolute inset-0 h-full w-full object-cover"
        />
        <div class="absolute inset-0 bg-black/25"></div>
        <h3
          class="relative z-10 flex h-full items-center justify-center px-4 text-center font-display text-2xl font-semibold uppercase text-white drop-shadow"
        >
          Khuvsgul lake
        </h3>
      </div>

      <div
        class="relative h-[370px] w-[252px] overflow-hidden rounded-2xl border-4 border-sky-200 shadow-md"
      >
        <img
          src="togoo.png"
          alt="Khorgiin togoo"
          class="absolute inset-0 h-full w-full object-cover"
        />
        <div class="absolute inset-0 bg-black/25"></div>
        <h3
          class="relative z-10 flex h-full items-center justify-center px-4 text-center font-display text-2xl font-semibold uppercase text-white drop-shadow"
        >
          Khorgiin togoo
        </h3>
      </div>
    </section>
    <div class="relative z-10 text-center">
      <h2 class="mt-16 text-3xl font-semibold">Destination of Our Agency</h2>
      <p class="mt-1 text-sm text-slate-500">Pack Your Bags And Get Ready</p>
    </div>
    <ul>
      <li
        class="flex h-16 items-center justify-between rounded-full bg-[#efe9d7] px-6 shadow-sm"
      >
        <div>
          <p class="text-base font-medium">Sukhbaatar square</p>
          <p class="flex items-center gap-1 text-[11px] text-slate-600">
            <img
              src="https://api.iconify.design/mdi/map-marker.svg?color=%23334155&width=12&height=12"
              alt=""
              class="h-3 w-3"
            />
            Ulaanbaatar
          </p>
        </div>
        <span
          class="grid h-12 w-12 place-items-center rounded-full bg-white text-[10px] font-semibold"
          >DAY 1</span
        >
      </li>
    </ul>
  </body>
</html>
